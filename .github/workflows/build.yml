name: build

# Analysing both `main` and pull requests is what enables PR analysis:
# the `main` runs establish the baseline, the `pull_request` runs are decorated
# back onto the PR by the SonarQube Cloud GitHub App.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test + SonarQube analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history: SonarQube needs blame data to attribute "new code".
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage xml -o coverage.xml
          coverage report

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          # SONAR_HOST_URL is intentionally absent: not needed for SonarQube Cloud.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Fails the job when the Quality Gate is red, so it can be made a
      # required status check and actually gate merging.
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
